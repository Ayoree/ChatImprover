buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "com.guardsquare:proguard-gradle:${proguard_version}"
    }
}

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'dev.yumi.gradle.licenser' version "${licenser_version}"
	id 'maven-publish'
}

compileJava.options.generatedSourceOutputDirectory = file("${projectDir}/build/generated/sources/annotationProcessor/java/main/org/ayoree/chatimprover/internal/configs")
sourceSets.main.java.srcDirs += [ 'build/generated/sources/annotationProcessor/java/main' ]

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenLocal()
	mavenCentral()
	// ModMenu
	maven { url 'https://maven.terraformersmc.com/' }
	// OWO lib
	maven { url 'https://maven.wispforest.io' }
	maven { url 'https://jitpack.io'}
}

dependencies {
	compileOnly 'com.google.auto.service:auto-service:1.1.1'
	annotationProcessor 'com.google.auto.service:auto-service:1.1.1'

	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	
	// Modmenu
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

	// OWO
	implementation "io.wispforest:owo-lib:${project.owo_version}"
    annotationProcessor "io.wispforest:owo-lib:${project.owo_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

license {
	rule(file("HEADER.txt"))
	include("**/*.java")
	exclude("**/ChatimproverConfig.java")
}

task proguard(type: proguard.gradle.ProGuardTask) {
	injars tasks.jar.archiveFile.get()
	outjars layout.buildDirectory.file("libs/${base.archivesName.get()}-${version}-obf.jar").get().asFile
	configuration 'proguard-rules.pro'

	doFirst {
        libraryjars files(configurations.compileClasspath.files)
        libraryjars "${System.getProperty('java.home')}/jmods/java.base.jmod"
    }

	dependsOn tasks.jar
}


publishing {
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/ayoree/${project.archives_base_name}")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
                password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
            }
        }
    }
    publications {
        gpr(MavenPublication) {
            from(components.java)
			artifactId = project.archives_base_name
        }
    }
}
